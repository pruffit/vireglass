name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Everything in the repository is English
        run: npm run check:english

      - name: Install Chromium for shader gates
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Shaders compile on both targets
        run: |
          npm run check:glsl
          npm run check:agsl

      - name: Optics stay within their envelope
        run: npm run check:optics

      - name: The GPU backdrop path matches the scene path
        run: npm run check:backdrop

      - name: Every calibrated value is written once
        run: npm run check:law

      - name: Build
        run: npm run build

      - name: The package loads from an install
        run: npm run check:package

      - name: Every name the docs tell you to import exists
        run: npm run check:readme

      # After the build: it drives the published bundle in a real browser, not the source.
      - name: The glass bends live DOM
        run: npm run check:dom
