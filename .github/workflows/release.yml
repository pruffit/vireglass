name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Install Chromium for shader gates
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Gates
        run: |
          npm run typecheck
          npm test
          npm run check:glsl
          npm run check:optics

      - run: npm run build

      # Skipped rather than failed when no token is configured: the gates above are the
      # point of this workflow, and a tag should not go red because publishing is not set up.
      - name: Check for an npm token
        id: token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publishing skipped
        if: steps.token.outputs.present != 'true'
        run: echo "::warning::NPM_TOKEN is not set — the package was built and gated but not published."
